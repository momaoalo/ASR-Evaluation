name: Windows onboarding smoke
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Fresh Windows Python 3.12 install
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the actual Windows setup script
        shell: cmd
        run: |
          call SETUP_WINDOWS.bat --ci
      - name: Validate portable installer PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $issues = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\INSTALL_MEDIA_WINDOWS.ps1).Path, [ref]$tokens, [ref]$issues) | Out-Null
          if ($issues.Count -gt 0) { throw ($issues | Out-String) }
          Write-Host 'Portable FFmpeg/Deno installation script parses successfully.'
      - name: Check yt-dlp and backend imports
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m yt_dlp --version
          .\.venv\Scripts\python.exe -c "import flask, waitress, humain_voice; print('Backend dependencies available')"
      - name: Offline setup regression tests and UI integrity
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m unittest discover -s tests -p test_youtube_setup.py -v
          .\.venv\Scripts\python.exe verify_package.py
          .\.venv\Scripts\python.exe -c "from app import create_app; c=create_app(start_worker=False).test_client(); r=c.get('/api/build'); assert r.status_code == 200, r.status_code; assert r.json['files_consistent'], r.json; print('Flask build endpoint OK')"
